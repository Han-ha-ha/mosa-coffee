<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | 墨上咖啡 — 这杯咖啡还没泡好</title>
<meta name="robots" content="noindex">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  background: #1A1410; color: #F5F0E8;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing: antialiased;
}
.bg-pattern {
  position: fixed; inset:0; opacity:0.03;
  background: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(200,169,110,0.3) 2px, rgba(200,169,110,0.3) 4px);
}
.container { text-align:center; position:relative; z-index:1; padding:2rem; }
.steam {
  display:flex; justify-content:center; gap:2px; margin-bottom:1rem;
}
.steam span {
  display:block; width:3px; height:30px;
  background: linear-gradient(to top, rgba(200,169,110,0.6), transparent);
  border-radius:2px;
  animation: rise 1.8s ease-in-out infinite;
}
.steam span:nth-child(2) { animation-delay:0.3s; height:40px; }
.steam span:nth-child(3) { animation-delay:0.6s; height:25px; }
.steam span:nth-child(4) { animation-delay:0.9s; height:35px; }
.steam span:nth-child(5) { animation-delay:1.2s; height:28px; }
@keyframes rise {
  0%,100% { transform:translateY(0) scaleY(1); opacity:0.6; }
  50% { transform:translateY(-20px) scaleY(0.6); opacity:0; }
}
.cup {
  font-size: 5rem; margin-bottom: 1rem;
  animation: wobble 3s ease-in-out infinite;
}
@keyframes wobble {
  0%,100% { transform: rotate(-3deg); }
  50% { transform: rotate(3deg); }
}
h1 { font-size:6rem; font-weight:700; color:#C8A96E; font-family:Georgia,serif; line-height:1; }
p { font-size:1.1rem; color:#B8A088; margin:1rem 0 2.5rem; font-weight:300; line-height:1.8; }
.btn {
  display:inline-flex; align-items:center; gap:0.5rem;
  padding:0.9rem 2rem; background:#C8A96E; color:#1A1410;
  text-decoration:none; font-size:0.9rem; font-weight:500;
  letter-spacing:0.06em; border:none; cursor:pointer;
  transition:0.4s cubic-bezier(0.25,0.1,0.25,1);
  font-family:inherit;
}
.btn:hover { background:#DFC896; transform:translateY(-2px); }
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="container">
  <div class="steam">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="cup">☕</div>
  <h1>404</h1>
  <p>这杯咖啡还没泡好<br>你找的页面——像深夜最后一杯手冲——已经卖完了</p>
  <a href="/mosa-coffee/" class="btn">← 回首页再点一杯</a>
</div>
</body>
</html>
